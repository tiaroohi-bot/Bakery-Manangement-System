<!DOCTYPE html>
<html>
<head>
    <title>Edit Customer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="header">
    <h1>🧁 Bakery Management System</h1>
    <p>Edit Customer</p>
</div>

<div class="navbar">
    <a href="/">Dashboard</a>
    <a href="/customers">Customers</a>
    <a href="/employees">Employees</a>
    <a href="/products">Products</a>
    <a href="/categories">Categories</a>
    <a href="/suppliers">Suppliers</a>
    <a href="/ingredients">Ingredients</a>
    <a href="/orders">Orders</a>
    <a href="/payments">Payments</a>
</div>

<div class="container">

<div class="form-box">

<h2>Edit Customer</h2>

<form method="POST"
      action="/update_customer/{{ customer.customer_id }}">

<label>Name</label>
<input type="text"
       name="name"
       value="{{ customer.name }}"
       required>

<label>Phone</label>
<input type="text"
       name="phone"
       value="{{ customer.phone or '' }}">

<label>Email</label>
<input type="email"
       name="email"
       value="{{ customer.email or '' }}">

<label>Address</label>
<input type="text"
       name="address"
       value="{{ customer.address or '' }}">

<button type="submit">Update Customer</button>

</form>

</div>

</div>

</body>
</html>
